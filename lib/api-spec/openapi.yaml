openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ingresos
    description: Registro de ingresos
  - name: gastos-fijos
    description: Gastos fijos configurados
  - name: gastos-variables
    description: Gastos variables del día a día
  - name: categorias
    description: Categorías de gastos variables
  - name: kilometraje
    description: Registros de kilometraje
  - name: moto
    description: Estado y mantenimiento de la moto
  - name: habitos
    description: Hábitos diarios y registro de cumplimiento
  - name: resumen
    description: Resumen financiero
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ingresos:
    get:
      operationId: listIngresos
      tags: [ingresos]
      summary: Lista ingresos
      responses:
        "200":
          description: Lista de ingresos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingreso"
    post:
      operationId: createIngreso
      tags: [ingresos]
      summary: Registra un ingreso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoInput"
      responses:
        "201":
          description: Ingreso creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingreso"
  /ingresos/{id}:
    get:
      operationId: getIngreso
      tags: [ingresos]
      summary: Obtiene un ingreso
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ingreso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingreso"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateIngreso
      tags: [ingresos]
      summary: Actualiza un ingreso
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoUpdate"
      responses:
        "200":
          description: Ingreso actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingreso"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteIngreso
      tags: [ingresos]
      summary: Elimina un ingreso
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Ingreso eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /gastos-fijos:
    get:
      operationId: listGastosFijos
      tags: [gastos-fijos]
      summary: Lista gastos fijos
      responses:
        "200":
          description: Lista de gastos fijos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GastoFijo"
    post:
      operationId: createGastoFijo
      tags: [gastos-fijos]
      summary: Registra un gasto fijo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoFijoInput"
      responses:
        "201":
          description: Gasto fijo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoFijo"
  /gastos-fijos/{id}:
    get:
      operationId: getGastoFijo
      tags: [gastos-fijos]
      summary: Obtiene un gasto fijo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Gasto fijo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoFijo"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGastoFijo
      tags: [gastos-fijos]
      summary: Actualiza un gasto fijo
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoFijoUpdate"
      responses:
        "200":
          description: Gasto fijo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoFijo"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGastoFijo
      tags: [gastos-fijos]
      summary: Elimina un gasto fijo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Gasto fijo eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /gastos-variables:
    get:
      operationId: listGastosVariables
      tags: [gastos-variables]
      summary: Lista gastos variables
      responses:
        "200":
          description: Lista de gastos variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GastoVariable"
    post:
      operationId: createGastoVariable
      tags: [gastos-variables]
      summary: Registra un gasto variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoVariableInput"
      responses:
        "201":
          description: Gasto variable creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoVariable"
  /gastos-variables/{id}:
    get:
      operationId: getGastoVariable
      tags: [gastos-variables]
      summary: Obtiene un gasto variable
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Gasto variable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoVariable"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGastoVariable
      tags: [gastos-variables]
      summary: Actualiza un gasto variable
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoVariableUpdate"
      responses:
        "200":
          description: Gasto variable actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoVariable"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGastoVariable
      tags: [gastos-variables]
      summary: Elimina un gasto variable
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Gasto variable eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /categorias:
    get:
      operationId: listCategorias
      tags: [categorias]
      summary: Lista categorías
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
    post:
      operationId: createCategoria
      tags: [categorias]
      summary: Crea una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaInput"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "400":
          description: Nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categorias/{id}:
    get:
      operationId: getCategoria
      tags: [categorias]
      summary: Obtiene una categoría
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCategoria
      tags: [categorias]
      summary: Actualiza una categoría
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaUpdate"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCategoria
      tags: [categorias]
      summary: Elimina una categoría
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Categoría eliminada
        "400":
          description: Categoría en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /kilometraje:
    get:
      operationId: listKilometrajes
      tags: [kilometraje]
      summary: Lista registros de kilometraje
      responses:
        "200":
          description: Lista de kilometraje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kilometraje"
    post:
      operationId: createKilometraje
      tags: [kilometraje]
      summary: Registra kilometraje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KilometrajeInput"
      responses:
        "201":
          description: Kilometraje creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kilometraje"
        "400":
          description: El odómetro no puede retroceder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /kilometraje/resumen:
    get:
      operationId: getKilometrajeResumen
      tags: [kilometraje]
      summary: Resumen del kilometraje (odómetro actual y cantidad de registros)
      responses:
        "200":
          description: Resumen de kilometraje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KilometrajeResumen"
  /kilometraje/{id}:
    get:
      operationId: getKilometraje
      tags: [kilometraje]
      summary: Obtiene un registro de kilometraje
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Registro de kilometraje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kilometraje"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateKilometraje
      tags: [kilometraje]
      summary: Actualiza kilometraje
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KilometrajeUpdate"
      responses:
        "200":
          description: Registro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kilometraje"
        "400":
          description: El valor rompe el orden cronológico del odómetro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteKilometraje
      tags: [kilometraje]
      summary: Elimina kilometraje
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Registro eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /moto/estado-aceite:
    get:
      operationId: getMotoEstadoAceite
      tags: [moto]
      summary: Estado del aceite de la moto
      responses:
        "200":
          description: Estado del aceite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoAceite"
  /moto/cambio-aceite:
    post:
      operationId: postMotoCambioAceite
      tags: [moto]
      summary: Registra un cambio de aceite
      responses:
        "200":
          description: Estado del aceite actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoAceite"
  /moto/config:
    put:
      operationId: putMotoConfig
      tags: [moto]
      summary: Actualiza la configuración del aceite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MotoConfigUpdate"
      responses:
        "200":
          description: Estado del aceite actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoAceite"
  /habitos:
    get:
      operationId: listHabitos
      tags: [habitos]
      summary: Lista hábitos
      responses:
        "200":
          description: Lista de hábitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habito"
    post:
      operationId: createHabito
      tags: [habitos]
      summary: Crea un hábito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitoInput"
      responses:
        "201":
          description: Hábito creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habito"
        "400":
          description: Nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /habitos/resumen/{fecha}:
    get:
      operationId: getResumenHabitos
      tags: [habitos]
      summary: Resumen de hábitos para una fecha (con racha y cumplimiento)
      parameters:
        - name: fecha
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen de hábitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitoResumenItem"
  /habitos/{id}/racha:
    get:
      operationId: getRachaHabito
      tags: [habitos]
      summary: Racha actual de un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Racha del hábito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Racha"
        "404":
          $ref: "#/components/responses/NotFound"
  /habitos/{id}:
    get:
      operationId: getHabito
      tags: [habitos]
      summary: Obtiene un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Hábito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habito"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateHabito
      tags: [habitos]
      summary: Actualiza un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitoUpdate"
      responses:
        "200":
          description: Hábito actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habito"
        "400":
          description: Nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHabito
      tags: [habitos]
      summary: Elimina un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Hábito eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /habitos/{id}/check/{fecha}:
    post:
      operationId: toggleHabitoFecha
      tags: [habitos]
      summary: Marca o desmarca un hábito en una fecha
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: fecha
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Estado de cumplimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckHabitoResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /resumen/mes-actual:
    get:
      operationId: getResumenMesActual
      tags: [resumen]
      summary: Calcula el resumen financiero del mes actual
      responses:
        "200":
          description: Resumen financiero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenMensual"
  /resumen/mes-actual/por-categoria:
    get:
      operationId: getResumenMensualPorCategoria
      tags: [resumen]
      summary: Resumen de gastos variables del mes desglosado por categoría
      responses:
        "200":
          description: Desglose por categoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumenCategoria"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        detail:
          type: string
      required: [detail]
    Ingreso:
      type: object
      properties:
        id:
          type: number
        fecha:
          type: string
          format: date
        fuente:
          type: string
          enum: [Didi, papa, amigo, otro]
        monto:
          type: number
          minimum: 0
        nota:
          type: string
      required: [id, fecha, fuente, monto, nota]
    IngresoInput:
      type: object
      properties:
        fecha:
          type: string
          format: date
        fuente:
          type: string
          enum: [Didi, papa, amigo, otro]
        monto:
          type: number
          minimum: 0
        nota:
          type: string
      required: [fecha, fuente, monto, nota]
    IngresoUpdate:
      type: object
      properties:
        fecha:
          type: string
          format: date
        fuente:
          type: string
          enum: [Didi, papa, amigo, otro]
        monto:
          type: number
          minimum: 0
        nota:
          type: string
    GastoFijo:
      type: object
      properties:
        id:
          type: number
        nombre:
          type: string
        monto:
          type: number
          minimum: 0
        tipo:
          type: string
          enum: [mensual, por_kilometraje]
        activo:
          type: boolean
      required: [id, nombre, monto, tipo, activo]
    GastoFijoInput:
      type: object
      properties:
        nombre:
          type: string
        monto:
          type: number
          minimum: 0
        tipo:
          type: string
          enum: [mensual, por_kilometraje]
        activo:
          type: boolean
      required: [nombre, monto, tipo, activo]
    GastoFijoUpdate:
      type: object
      properties:
        nombre:
          type: string
        monto:
          type: number
          minimum: 0
        tipo:
          type: string
          enum: [mensual, por_kilometraje]
        activo:
          type: boolean
    Categoria:
      type: object
      properties:
        id:
          type: number
        nombre:
          type: string
        icono:
          type: string
        color:
          type: string
        activa:
          type: boolean
      required: [id, nombre, icono, color, activa]
    CategoriaInput:
      type: object
      properties:
        nombre:
          type: string
        icono:
          type: string
        color:
          type: string
        activa:
          type: boolean
      required: [nombre]
    CategoriaUpdate:
      type: object
      properties:
        nombre:
          type: string
        icono:
          type: string
        color:
          type: string
        activa:
          type: boolean
    GastoVariable:
      type: object
      properties:
        id:
          type: number
        fecha:
          type: string
          format: date
        categoria_id:
          type: number
          minimum: 1
        monto:
          type: number
          minimum: 0
        nota:
          type: string
      required: [id, fecha, categoria_id, monto, nota]
    GastoVariableInput:
      type: object
      properties:
        fecha:
          type: string
          format: date
        categoria_id:
          type: number
          minimum: 1
        monto:
          type: number
          minimum: 0
        nota:
          type: string
      required: [fecha, categoria_id, monto]
    GastoVariableUpdate:
      type: object
      properties:
        fecha:
          type: string
          format: date
        categoria_id:
          type: number
          minimum: 1
        monto:
          type: number
          minimum: 0
        nota:
          type: string
    Kilometraje:
      type: object
      properties:
        id:
          type: number
        fecha:
          type: string
          format: date
        km_actuales:
          type: number
          minimum: 0
        nota:
          type: string
      required: [id, fecha, km_actuales, nota]
    KilometrajeInput:
      type: object
      properties:
        fecha:
          type: string
          format: date
        km_actuales:
          type: number
          minimum: 0
        nota:
          type: string
      required: [fecha, km_actuales, nota]
    KilometrajeUpdate:
      type: object
      properties:
        fecha:
          type: string
          format: date
        km_actuales:
          type: number
          minimum: 0
        nota:
          type: string
    KilometrajeResumen:
      type: object
      properties:
        km_actuales:
          type: number
          minimum: 0
        registros:
          type: number
          minimum: 0
      required: [km_actuales, registros]
    ResumenMensual:
      type: object
      properties:
        mes:
          type: string
        total_ingresos:
          type: number
        total_gastos_fijos:
          type: number
        total_gastos_variables:
          type: number
        saldo:
          type: number
      required: [mes, total_ingresos, total_gastos_fijos, total_gastos_variables, saldo]
    ResumenCategoria:
      type: object
      properties:
        id:
          type: number
        nombre:
          type: string
        icono:
          type: string
        color:
          type: string
        cantidad:
          type: number
        total:
          type: number
        porcentaje:
          type: number
      required: [id, nombre, icono, color, cantidad, total, porcentaje]
    EstadoAceite:
      type: object
      properties:
        km_actuales:
          type: number
          minimum: 0
        km_ultimo_cambio:
          type: number
          minimum: 0
        km_proximo_cambio:
          type: number
          minimum: 0
        km_restantes:
          type: number
