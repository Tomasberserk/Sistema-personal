openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ingresos
    description: Registro de ingresos
  - name: gastos-fijos
    description: Gastos fijos configurados
  - name: gastos-variables
    description: Gastos variables del día a día
  - name: categorias
    description: Categorías de gastos variables
  - name: kilometraje
    description: Registros de kilometraje
  - name: moto
    description: Estado y mantenimiento de la moto
  - name: habitos
    description: Hábitos diarios y registro de cumplimiento
  - name: medios-pago
    description: Medios de pago y ubicaciones de dinero
  - name: transferencias
    description: Transferencias de dinero entre medios
  - name: rutina
    description: Rutina y cronograma semanal
  - name: fechas-especiales
    description: Cumpleaños, aniversarios y eventos especiales
  - name: recordatorios
    description: Recordatorios y notificaciones universales
  - name: resumen
    description: Resumen financiero
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ingresos:
    get:
      operationId: listIngresos
      tags: [ingresos]
      summary: Lista ingresos
      responses:
        "200":
          description: Lista de ingresos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingreso"
    post:
      operationId: createIngreso
      tags: [ingresos]
      summary: Registra un ingreso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoInput"
      responses:
        "201":
          description: Ingreso creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingreso"
  /ingresos/{id}:
    get:
      operationId: getIngreso
      tags: [ingresos]
      summary: Obtiene un ingreso
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ingreso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingreso"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateIngreso
      tags: [ingresos]
      summary: Actualiza un ingreso
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoUpdate"
      responses:
        "200":
          description: Ingreso actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingreso"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteIngreso
      tags: [ingresos]
      summary: Elimina un ingreso
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Ingreso eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /gastos-fijos:
    get:
      operationId: listGastosFijos
      tags: [gastos-fijos]
      summary: Lista gastos fijos
      responses:
        "200":
          description: Lista de gastos fijos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GastoFijo"
    post:
      operationId: createGastoFijo
      tags: [gastos-fijos]
      summary: Registra un gasto fijo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoFijoInput"
      responses:
        "201":
          description: Gasto fijo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoFijo"
  /gastos-fijos/{id}:
    get:
      operationId: getGastoFijo
      tags: [gastos-fijos]
      summary: Obtiene un gasto fijo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Gasto fijo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoFijo"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGastoFijo
      tags: [gastos-fijos]
      summary: Actualiza un gasto fijo
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoFijoUpdate"
      responses:
        "200":
          description: Gasto fijo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoFijo"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGastoFijo
      tags: [gastos-fijos]
      summary: Elimina un gasto fijo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Gasto fijo eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /gastos-variables:
    get:
      operationId: listGastosVariables
      tags: [gastos-variables]
      summary: Lista gastos variables
      responses:
        "200":
          description: Lista de gastos variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GastoVariable"
    post:
      operationId: createGastoVariable
      tags: [gastos-variables]
      summary: Registra un gasto variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoVariableInput"
      responses:
        "201":
          description: Gasto variable creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoVariable"
  /gastos-variables/{id}:
    get:
      operationId: getGastoVariable
      tags: [gastos-variables]
      summary: Obtiene un gasto variable
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Gasto variable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoVariable"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGastoVariable
      tags: [gastos-variables]
      summary: Actualiza un gasto variable
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GastoVariableUpdate"
      responses:
        "200":
          description: Gasto variable actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GastoVariable"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGastoVariable
      tags: [gastos-variables]
      summary: Elimina un gasto variable
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Gasto variable eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /categorias:
    get:
      operationId: listCategorias
      tags: [categorias]
      summary: Lista categorías
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
    post:
      operationId: createCategoria
      tags: [categorias]
      summary: Crea una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaInput"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "400":
          description: Nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categorias/{id}:
    get:
      operationId: getCategoria
      tags: [categorias]
      summary: Obtiene una categoría
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCategoria
      tags: [categorias]
      summary: Actualiza una categoría
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaUpdate"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCategoria
      tags: [categorias]
      summary: Elimina una categoría
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Categoría eliminada
        "400":
          description: Categoría en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /kilometraje:
    get:
      operationId: listKilometrajes
      tags: [kilometraje]
      summary: Lista registros de kilometraje
      responses:
        "200":
          description: Lista de kilometraje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kilometraje"
    post:
      operationId: createKilometraje
      tags: [kilometraje]
      summary: Registra kilometraje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KilometrajeInput"
      responses:
        "201":
          description: Kilometraje creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kilometraje"
        "400":
          description: El odómetro no puede retroceder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /kilometraje/resumen:
    get:
      operationId: getKilometrajeResumen
      tags: [kilometraje]
      summary: Resumen del kilometraje (odómetro actual y cantidad de registros)
      responses:
        "200":
          description: Resumen de kilometraje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KilometrajeResumen"
  /kilometraje/{id}:
    get:
      operationId: getKilometraje
      tags: [kilometraje]
      summary: Obtiene un registro de kilometraje
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Registro de kilometraje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kilometraje"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateKilometraje
      tags: [kilometraje]
      summary: Actualiza kilometraje
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KilometrajeUpdate"
      responses:
        "200":
          description: Registro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kilometraje"
        "400":
          description: El valor rompe el orden cronológico del odómetro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteKilometraje
      tags: [kilometraje]
      summary: Elimina kilometraje
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Registro eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /moto/estado-aceite:
    get:
      operationId: getMotoEstadoAceite
      tags: [moto]
      summary: Estado del aceite de la moto
      responses:
        "200":
          description: Estado del aceite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoAceite"
  /moto/cambio-aceite:
    post:
      operationId: postMotoCambioAceite
      tags: [moto]
      summary: Registra un cambio de aceite
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioAceiteInput"
      responses:
        "200":
          description: Estado del aceite actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoAceite"
  /medios-pago:
    get:
      operationId: listMediosPago
      tags: [medios-pago]
      summary: Lista medios de pago con sus saldos calculados
      responses:
        "200":
          description: Lista de medios de pago con saldos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedioPagoSaldo"
    post:
      operationId: createMedioPago
      tags: [medios-pago]
      summary: Crea un medio de pago
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedioPagoInput"
      responses:
        "201":
          description: Medio de pago creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedioPago"
        "400":
          description: Nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /medios-pago/{id}:
    get:
      operationId: getMedioPago
      tags: [medios-pago]
      summary: Obtiene un medio de pago
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Medio de pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedioPago"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMedioPago
      tags: [medios-pago]
      summary: Actualiza un medio de pago
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedioPagoUpdate"
      responses:
        "200":
          description: Medio de pago actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedioPago"
        "400":
          description: Error de validación o nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMedioPago
      tags: [medios-pago]
      summary: Elimina un medio de pago
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Medio de pago eliminado
        "400":
          description: No se puede eliminar si tiene transacciones asociadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /transferencias:
    get:
      operationId: listTransferencias
      tags: [transferencias]
      summary: Lista transferencias entre medios
      responses:
        "200":
          description: Lista de transferencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferenciaMedio"
    post:
      operationId: createTransferencia
      tags: [transferencias]
      summary: Registra una transferencia entre dos medios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferenciaMedioInput"
      responses:
        "201":
          description: Transferencia registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferenciaMedio"
        "400":
          description: Error de validación (ej. origen igual a destino)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Medio de pago no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transferencias/{id}:
    delete:
      operationId: deleteTransferencia
      tags: [transferencias]
      summary: Elimina una transferencia
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Transferencia eliminada
        "404":
          $ref: "#/components/responses/NotFound"
  /moto/config:
    put:
      operationId: putMotoConfig
      tags: [moto]
      summary: Actualiza la configuración del aceite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MotoConfigUpdate"
      responses:
        "200":
          description: Estado del aceite actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoAceite"
  /habitos:
    get:
      operationId: listHabitos
      tags: [habitos]
      summary: Lista hábitos
      responses:
        "200":
          description: Lista de hábitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habito"
    post:
      operationId: createHabito
      tags: [habitos]
      summary: Crea un hábito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitoInput"
      responses:
        "201":
          description: Hábito creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habito"
        "400":
          description: Nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /habitos/resumen/{fecha}:
    get:
      operationId: getResumenHabitos
      tags: [habitos]
      summary: Resumen de hábitos para una fecha (con racha y cumplimiento)
      parameters:
        - name: fecha
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen de hábitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitoResumenItem"
  /habitos/{id}/racha:
    get:
      operationId: getRachaHabito
      tags: [habitos]
      summary: Racha actual de un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Racha del hábito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Racha"
        "404":
          $ref: "#/components/responses/NotFound"
  /habitos/{id}:
    get:
      operationId: getHabito
      tags: [habitos]
      summary: Obtiene un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Hábito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habito"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateHabito
      tags: [habitos]
      summary: Actualiza un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitoUpdate"
      responses:
        "200":
          description: Hábito actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habito"
        "400":
          description: Nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHabito
      tags: [habitos]
      summary: Elimina un hábito
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Hábito eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /habitos/{id}/check/{fecha}:
    post:
      operationId: toggleHabitoFecha
      tags: [habitos]
      summary: Marca o desmarca un hábito en una fecha
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: fecha
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Estado de cumplimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckHabitoResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /rutina/bloques:
    get:
      operationId: listBloquesRutina
      tags: [rutina]
      summary: Lista todos los bloques de rutina
      responses:
        "200":
          description: Lista de bloques
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BloqueRutina"
    post:
      operationId: createBloqueRutina
      tags: [rutina]
      summary: Crea un bloque de rutina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloqueRutinaInput"
      responses:
        "201":
          description: Bloque creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloqueRutina"
        "400":
          description: hora_fin debe ser posterior a hora_inicio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rutina/semana:
    get:
      operationId: getRutinaSemana
      tags: [rutina]
      summary: Los 7 días con sus bloques activos
      responses:
        "200":
          description: Semana completa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaRutina"
  /rutina/dia/{dia_semana}:
    get:
      operationId: getRutinaDia
      tags: [rutina]
      summary: Bloques activos de un día (0=lunes … 6=domingo)
      parameters:
        - name: dia_semana
          in: path
          required: true
          schema:
            type: number
            minimum: 0
            maximum: 6
      responses:
        "200":
          description: Bloques del día
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BloqueRutina"
        "400":
          description: Día fuera de rango
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rutina/bloques/{id}:
    get:
      operationId: getBloqueRutina
      tags: [rutina]
      summary: Obtiene un bloque de rutina
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Bloque de rutina
          content:
            application/json:
              schema:
