services:
  - type: web
    name: jarvis-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "604800"
      - key: ALLOW_DEMO_SWITCH
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
